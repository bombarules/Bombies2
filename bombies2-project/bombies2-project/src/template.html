<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Bombies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --page:#22252a; --shell-hi:#5a5f66; --shell:#3c4047; --shell-lo:#24272c;
  --face:#121316; --face-edge:#2b2e33; --stripe-hi:#4a4e55; --stripe-lo:#2c2f34;
  --red:#b3261e; --red-hi:#e8574a; --red-lo:#5e0d09; --label:#c9b37a;
  --hud:#ece8df; --hud-dim:rgba(236,232,223,.6); --amber:#e0a43a;
  color-scheme:light dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0b0c0e;}}
:root[data-theme="dark"]{--page:#0b0c0e;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;background:var(--page);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{height:100%;display:flex;flex-direction:column;font-family:'Bebas Neue',Impact,"Arial Narrow",sans-serif;color:var(--hud);letter-spacing:.03em}
#game{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;background:#000}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;gap:5px}
.hp{width:120px;height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.22);overflow:hidden}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#7a120c,#d23a22);transition:width .15s}
#score{font-size:20px;text-shadow:0 1px 2px #000}
#wave{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:18px;color:var(--hud-dim);text-shadow:0 1px 2px #000}
.br{position:absolute;right:12px;top:8px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
#weapName{font-size:16px;color:var(--label);text-shadow:0 1px 2px #000}
.ammo{font-size:36px;line-height:1;text-shadow:0 2px 3px #000}
.ammo small{font-size:16px;color:var(--hud-dim);margin-left:3px}
.ammo.low{color:var(--amber)}
#reloadRing{width:22px;height:22px;margin-top:4px;opacity:0;transition:opacity .1s}#reloadRing.on{opacity:1}
#xhair{position:absolute;left:50%;top:50%;width:0;height:0;--s:9px}
#xhair i{position:absolute;background:var(--hud);box-shadow:0 0 2px #000}
#xhair i:nth-child(1){width:2px;height:7px;left:-1px;top:calc(-1*var(--s) - 7px)}
#xhair i:nth-child(2){width:2px;height:7px;left:-1px;top:var(--s)}
#xhair i:nth-child(3){width:7px;height:2px;top:-1px;left:calc(-1*var(--s) - 7px)}
#xhair i:nth-child(4){width:7px;height:2px;top:-1px;left:var(--s)}
#xhair b{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:var(--hud)}
#hit{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;opacity:0}
#hit::before,#hit::after{content:"";position:absolute;left:11px;top:0;width:2px;height:24px;background:#fff;box-shadow:0 0 3px #000}
#hit::before{transform:rotate(45deg)}#hit::after{transform:rotate(-45deg)}
#hit.kill::before,#hit.kill::after{background:#e2402c}
#hs{position:absolute;left:0;right:0;top:calc(50% + 22px);text-align:center;font-size:20px;color:#e2402c;text-shadow:0 1px 3px #000;opacity:0}
#cap{position:absolute;left:12%;right:12%;bottom:12px;text-align:center;font-family:system-ui,sans-serif;letter-spacing:0;font-size:13px;color:#f1ece1;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .25s}
#cap.on{opacity:1}
#ovsub:empty{display:none}
#menu{pointer-events:auto;display:flex;flex-direction:column;gap:min(8px,1.8cqh);margin:min(14px,3cqh) 0 min(6px,1.5cqh);width:min(80%,300px);flex:0 1 auto;min-height:0}
.mi{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.08em;font-size:min(22px,6.6cqh);line-height:1.1;color:var(--hud);background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.18);border-left:4px solid transparent;padding:min(8px,1.9cqh) 14px;flex:none;text-align:left;cursor:pointer}
.mi .sw{float:right;width:40px;height:20px;border-radius:10px;background:#3a3a3e;position:relative;margin-top:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.mi .sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#9a9a9e;transition:left .15s,background .15s}
.mi .sw.on{background:#c63a28}.mi .sw.on::after{left:22px;background:#fff}
#menu{max-height:none;overflow-y:auto}
.xy{display:flex;gap:4cqw;align-items:flex-start;margin-bottom:-1cqh}
.sq.sm{width:42px;width:min(10.5cqw,30cqh)}
.rb.gb{background:radial-gradient(circle at 36% 30%,#7a7f88,#3a3e46 46%,#16181c);box-shadow:0 3px 0 #090a0c,inset 0 -3px 6px rgba(0,0,0,.35)}
.rb.gb.on{box-shadow:0 1px 0 #090a0c,inset 0 3px 6px rgba(0,0,0,.45)}
.hp.ally{width:80px;height:5px;margin-top:-2px}#allyfill{height:100%;width:100%;background:linear-gradient(90deg,#1f5a8a,#4aa3e0)}
#nades{font-size:13px;color:var(--hud-dim);text-shadow:0 1px 2px #000}
#hud.breath #vig{opacity:.35!important;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.85) 100%)}
#loadout{position:absolute;left:0;top:0;bottom:0;width:60%;max-width:300px;display:none;flex-direction:column;gap:4px;padding:8px 8px 8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:linear-gradient(90deg,rgba(8,10,12,.94),rgba(8,10,12,.8) 75%,rgba(8,10,12,0));pointer-events:auto;z-index:6;font-family:'Bebas Neue',system-ui,sans-serif;color:#ece6da;overflow:hidden;box-sizing:border-box}
#loadout.on{display:flex}
#hud.lo .tl,#hud.lo .tr,#hud.lo .tc,#hud.lo #xhair,#hud.lo .br,#hud.lo #prompt{display:none!important}
.lohead{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid rgba(232,210,122,.35);padding-bottom:2px;flex:none}
.lot{font-size:20px;letter-spacing:.06em;line-height:1}.los{font-family:system-ui,sans-serif;font-size:10px;color:#a59f92}
#loSlots{display:flex;flex-direction:column;gap:3px;flex:none}
.slot{position:relative;display:grid;grid-template-columns:14px 34px 1fr 14px;align-items:center;column-gap:4px;height:34px;padding:9px 2px 1px;box-sizing:border-box;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden}
.slot.sel{border-color:#e8d27a;background:rgba(232,210,122,.1);box-shadow:inset 3px 0 0 #c9472f}
.slab{position:absolute;left:5px;top:1px;font-size:9px;line-height:1;letter-spacing:.12em;color:#c9b56a}
.sic{color:#d8d2c4;display:grid;place-items:center;height:16px}.sic svg{width:34px;height:13px;fill:currentColor}
.snm{font-size:14px;line-height:1;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr{background:none;border:0;color:#e8d27a;font-size:18px;line-height:1;padding:0;cursor:pointer;touch-action:manipulation;height:100%}
#loDet{flex:1;min-height:30px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:2px 4px;overflow:hidden}
.desc{font-family:system-ui,sans-serif;font-size:11px;line-height:1.25;color:#bdb6a8}
.bar{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px;font-family:system-ui,sans-serif;font-size:9.5px;color:#a59f92}.bar b{font-weight:500}
.bar i{display:block;height:4px;border-radius:2px;background:linear-gradient(90deg,#e8d27a calc(var(--v)*100%),rgba(255,255,255,.15) 0)}
.loact{display:flex;gap:5px;flex:none}.lob{flex:1;font-family:inherit;font-size:15px;line-height:1;letter-spacing:.05em;padding:7px 2px;white-space:nowrap;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#ece6da;border-radius:3px}
.lob.go{background:#c9472f;border-color:#e0664c}.lob.sel{outline:2px solid #e8d27a;outline-offset:1px}
#menu.settings{gap:min(5px,1.1cqh);width:min(94%,380px)}#menu.settings .mi{font-size:min(15px,4.5cqh);padding:min(5px,1.1cqh) 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.sl{display:flex;align-items:center;gap:6px;flex:0 0 58%}.sl i{font-style:normal;font-family:system-ui,sans-serif;font-size:16px;width:20px;height:20px;line-height:19px;text-align:center;border-radius:50%;background:rgba(255,255,255,.12);color:#ece6da}
.strk{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}.strk span{position:absolute;left:0;top:0;bottom:0;background:#e8d27a;border-radius:3px}
.sl em{font-style:normal;font-family:system-ui,sans-serif;font-size:11px;width:24px;text-align:right;color:#bdb6a8}
#stealth{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fc49a;text-shadow:0 1px 2px #000;text-align:center;min-height:14px}#stealth.sp{color:#ff6a50}
@container (max-height:420px){#kicker{display:none}}
@container (max-height:340px){#ovhint{display:none}}
#hud.cheats #ovtitle,#hud.cheats h1{font-size:min(30px,9cqh)!important}
#menu.settings .sl i{width:min(20px,5.5cqh);height:min(20px,5.5cqh);line-height:min(19px,5.3cqh);font-size:min(16px,4.6cqh)}
#hud.pz #wave,#hud.pz #stealth,#hud.pz #msg,#hud.cheats #wave,#hud.cheats #stealth,#hud.cheats #msg,#hud.menu #msg{visibility:hidden!important}
#hud.pz .tl,#hud.pz .tr,#hud.pz .tc,#hud.pz .br,#hud.pz #xhair,#hud.pz #prompt{visibility:hidden}
.slot.gun{grid-template-columns:14px 34px 1fr auto 14px}.mods{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#e8d27a;background:rgba(232,210,122,.12);border:1px solid rgba(232,210,122,.45);border-radius:3px;padding:3px 5px;line-height:1;margin-right:2px}
.slot.att{grid-template-columns:14px 1fr auto 14px}.pips{display:flex;gap:3px;margin-right:4px}.pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22)}.pips i.on{background:#e8d27a}
#scopeov{position:absolute;inset:0;pointer-events:none;display:none;z-index:4}
#scopeov.on{display:block}
#scopeov.on{background:radial-gradient(circle at 50% 50%,transparent 0,transparent var(--r),rgba(0,0,0,.6) calc(var(--r) + 1px),#000 calc(var(--r) + 6px))}
#scopeov.zlo{--r:44vmin}#scopeov.zhi{--r:34vmin}
#scopeov .ret{position:absolute;left:50%;top:50%;width:calc(var(--r)*2);height:calc(var(--r)*2);transform:translate(-50%,-50%);border-radius:50%;box-shadow:inset 0 0 18px rgba(0,0,0,.7)}
#scopeov.zhi .ret{background:linear-gradient(#111,#111) center/1.5px 100% no-repeat,linear-gradient(#111,#111) center/100% 1.5px no-repeat}
#scopeov.zhi .ret::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#c62a1c}
#scopeov.zlo .ret::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#ff3a26;box-shadow:0 0 6px #ff3a26}
#hud:has(#scopeov.on) #xhair{opacity:0}
body.mapview [data-map]::after{content:attr(data-map);position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:#c9472f;color:#fff;font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.02em;padding:2px 5px;border-radius:3px;white-space:nowrap;z-index:9;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.mapview .mini{position:relative}body.mapview .stick[data-map]::after{top:2px;transform:translate(-50%,0)}body.mapview .dp.d::after{top:auto;bottom:-6px;transform:translate(-50%,100%)}body.mapview .fb.a::after{top:auto;bottom:-6px;transform:translate(-50%,100%)}
body.mapview .dp.l::after{left:auto;right:100%;top:50%;transform:translate(-4px,-50%)}body.mapview .dp.r::after{left:100%;top:50%;transform:translate(4px,-50%)}
body.mapview .fb::after{inset:auto;width:auto;height:auto;border-radius:3px}body.mapview .fb.x::after{left:auto;right:100%;top:50%;transform:translate(-4px,-50%)}body.mapview .fb.b::after{left:auto;right:-2px;top:-4px;transform:translateY(-100%)}body.mapview .fb.y::after{left:auto;right:100%;top:30%;transform:translate(-4px,-50%)}
.maplist{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-family:system-ui,sans-serif;font-size:min(10.5px,3.2cqh);color:#d9d3c5;text-align:left;margin-bottom:4px;pointer-events:none}.maplist span{line-height:1.25}.maplist b{display:block;font-weight:600;color:#e8d27a;font-size:.9em}
.strk.steps{display:flex;gap:3px;background:none;height:auto;overflow:visible}.strk.steps b{flex:1;height:7px;border-radius:2px;background:rgba(255,255,255,.15)}.strk.steps b.on{background:#e8d27a}
/* overlay layout for tall phones: the game fills the whole screen and the controller floats over the bottom of it */
body.overlay{--padH:calc(min(100vw * .66, 46vh) + 22px + env(safe-area-inset-bottom,0px))}
body.overlay #game{position:fixed;inset:0;flex:none}
body.overlay #pad{position:fixed;left:0;right:0;bottom:0;height:var(--padH);flex:none;padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));background:none;z-index:5;pointer-events:none}
body.overlay #pad .ctl,:root body.overlay #pad .ctl{pointer-events:auto;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(230,230,236,.2))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 24px rgba(0,0,0,.2)!important;border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
body.overlay #pad .ctl .stick{box-shadow:0 0 0 3px rgba(255,255,255,.45),inset 0 4px 10px rgba(0,0,0,.9)}
body.overlay #pad .shell{pointer-events:auto;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(225,226,232,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
body.overlay #pad .logo{color:rgba(255,255,255,.55)}
body.overlay #overlay,body.overlay #loadout{bottom:var(--padH)}
body.overlay #prompt{bottom:calc(var(--padH) + 8px)}
body.overlay #fsBtn{bottom:calc(var(--padH) + 8px)}
body.overlay.alley-full #game{position:relative;inset:auto}
/* desktop / landscape: smaller controller over a full-screen game, bigger menus and loadout */
body.desk{--padH:calc(min(30vh,260px) + 16px)}
body.desk #pad .ctl{max-width:min(46vw,620px)}
body.desk #loadout{zoom:1.7;bottom:calc(var(--padH) / 1.7)}
body.desk #menu{width:min(56%,560px)}
body.desk #menu .mi{font-size:min(32px,5.2cqh);padding:min(12px,1.6cqh) 18px}
body.desk #menu.settings .mi{font-size:min(24px,4.2cqh);padding:min(8px,1.1cqh) 14px}
body.desk #menu.grid .mi{font-size:min(20px,3.6cqh)}
body.desk #overlay h1{font-size:min(96px,13cqh)}
body.desk #ovhint{font-size:min(16px,2.8cqh)}
body.desk .sl i,body.desk .pick i{width:26px;height:26px;line-height:25px;font-size:20px}
#loader{position:fixed;inset:0;z-index:50;background:#070708;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader img{width:min(78vw,62vh,520px);height:auto;border-radius:50%;box-shadow:0 0 60px rgba(232,180,60,.25)}
#loader .lbar{width:min(70vw,420px);height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(232,190,90,.4)}
#loader .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862a,#f0cc6a,#b8862a);animation:lfill 2.2s cubic-bezier(.2,.7,.3,1) forwards}
#loader.done .lbar i{width:100%!important;animation:none}
#loader .ltxt{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.18em;color:#e8c46a;font-size:18px}
@keyframes lfill{0%{width:0}60%{width:70%}100%{width:92%}}
/* controller map: every button on one screen in two columns */
#menu.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:min(96%,560px)}
#menu.mapgrid .mi{font-size:min(13px,3.8cqh);padding:min(5px,1.1cqh) 6px;display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap;letter-spacing:.02em}
#menu.mapgrid .pick em{min-width:0;font-size:.95em}#menu.mapgrid .pick i{width:16px;height:16px;line-height:15px;font-size:13px}
#menu.mapgrid .mi:nth-last-child(-n+2){justify-content:center}
/* calmer labels on the on-screen controller */
body.mapview [data-map]::after{background:rgba(12,12,14,.82)!important;color:#f0d78a!important;font:600 9px/1.2 system-ui,sans-serif!important;padding:2px 5px!important;border:1px solid rgba(240,215,138,.45);border-radius:4px!important;box-shadow:none!important;letter-spacing:.03em}
.bump{position:absolute;top:-34cqh;width:min(18cqw,64px);height:min(7cqh,24px);border-radius:10px 10px 6px 6px;border:0;background:linear-gradient(180deg,#3a3d44,#1d1f24);color:#d7dbe2;font:700 11px system-ui,sans-serif;letter-spacing:.05em;box-shadow:0 2px 0 #0b0c0e;z-index:3;touch-action:none}
.bump.l{left:6%}.bump.r{right:6%}.ctl{padding-top:11cqh!important;padding-bottom:1.5cqh!important}.bump.on{transform:translateY(2px);box-shadow:none;background:#2a2c31}
/* see-through controller over the game */
body.overlay #pad .ctl,:root body.overlay #pad .ctl{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(230,230,236,.06))!important;border-color:rgba(255,255,255,.25);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
body.overlay #pad .ctl .stick{opacity:.72}body.overlay #pad .fb,body.overlay #pad .dpad,body.overlay #pad .mini{opacity:.8}body.overlay #pad .bump{opacity:.8}
body.overlay #pad .logo{opacity:.35}
#menu.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(94%,420px);max-height:66vh}
#menu.grid .mi{font-size:13px;padding:5px 7px;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap;min-height:0}
#hud.cheats #ovtitle{font-size:30px!important;margin:0 0 4px}#hud.cheats #ovhint,#hud.cheats #kicker{display:none}#hud.cheats #menu.grid{max-height:none;gap:4px}
#menu.grid .mi .sw{width:30px;height:16px;margin-top:1px}#menu.grid .mi .sw::after{width:12px;height:12px}#menu.grid .mi .sw.on::after{left:16px}
#menu.grid .mi:last-child{grid-column:1/-1;text-align:center}
.mi.sel{border-left-color:#c63a28;background:linear-gradient(90deg,rgba(198,58,40,.45),rgba(10,10,12,.55));color:#fff}
.mi:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#hud.menu .tl,#hud.menu .br,#hud.menu #wave,#hud.menu #xhair{display:none}
#alhud,#alx,#alPause{display:none}
body.alley-full #pad{display:none}
#hud.alley #alPause{display:block}
#alPause{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:8px;pointer-events:auto;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:system-ui,sans-serif;font-weight:700;font-size:14px;z-index:6}
#hud.alley .tl,#hud.alley .br,#hud.alley #wave,#hud.alley #xhair,#hud.alley #prompt{display:none}
#hud.alley #alhud{display:flex}#hud.alley #alx{display:block}
#alhud{position:absolute;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;padding:8px 12px 8px 54px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:18px;text-shadow:0 1px 2px #000}
#alhud span{display:block}.al-l,.al-r{min-width:30%}.al-r{text-align:right;font-size:14px}.al-r span:last-child{color:var(--hud-dim);font-family:system-ui,sans-serif;font-size:11px;letter-spacing:0}
.al-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.al-bar{width:80%;height:6px;background:rgba(255,255,255,.2)}#alTime{display:block;height:100%;width:0;background:#e0a43a}
#alMiss b{color:#e2402c;font-weight:400}
#alx{position:absolute;width:0;height:0;left:50%;top:50%;transition:left .05s,top .05s}
#alx i{position:absolute;background:#ff5a3a;box-shadow:0 0 3px #000}
#alx i:nth-child(1){width:2px;height:9px;left:-1px;top:-16px}#alx i:nth-child(2){width:2px;height:9px;left:-1px;top:7px}
#alx i:nth-child(3){width:9px;height:2px;top:-1px;left:-16px}#alx i:nth-child(4){width:9px;height:2px;top:-1px;left:7px}
#prompt{position:absolute;left:0;right:0;top:62%;text-align:center;font-family:system-ui,sans-serif;letter-spacing:0;font-size:13px;color:#e8d49a;text-shadow:0 1px 3px #000}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(150,0,0,.8) 100%);opacity:0;transition:opacity .4s}
#msg{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:28px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .2s;padding:0 16px}
#msg.on{opacity:1}
#overlay{position:absolute;inset:0;container-type:size;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(6px,env(safe-area-inset-top,0px)) 16px 8px;box-sizing:border-box;text-align:center;background:linear-gradient(transparent 35%,rgba(0,0,0,.8))}
#overlay.hide{display:none}
#kicker{font-size:min(15px,4.4cqh);color:var(--label);letter-spacing:.3em}
#overlay h1{margin:0;font-weight:400;font-size:min(52px,13cqh,11cqw);line-height:.95;color:#e9e3d4;letter-spacing:.08em;text-shadow:0 3px 14px rgba(0,0,0,.9)}
#ovsub{margin:10px 0 2px;font-size:18px;animation:blink 1.1s steps(2) infinite}
#ovhint{margin:2px 0 0;font-family:system-ui,sans-serif;letter-spacing:0;font-size:min(12px,3.6cqh);line-height:1.45;color:var(--hud-dim);max-width:36ch}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#ovsub{animation:none}}
#fsBtn{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:6px;pointer-events:auto;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:var(--hud)}
#fsBtn svg{width:18px;height:18px}
#pad{flex:1 1 50%;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 8px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 70%)}
.shell{container-type:size;width:100%;height:100%;max-height:calc(100vw * .66);max-width:calc(50vh * 2.3);
  border-radius:16px;padding:3.2%;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell) 28%,var(--shell) 70%,var(--shell-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(0,0,0,.22),0 14px 28px rgba(0,0,0,.5)}
.face{width:100%;height:100%;border-radius:9px;background:var(--face);
  display:grid;grid-template-columns:1.15fr .85fr 1.15fr;align-items:center;padding:3cqh 3cqw;
  box-shadow:inset 0 0 0 2px var(--face-edge),inset 0 4px 10px rgba(0,0,0,.85)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.stick{position:relative;width:110px;width:min(34cqw,74cqh);aspect-ratio:1;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#2b2c30,#131416 72%);
  box-shadow:0 0 0 3px #2b2c31,0 0 0 4px rgba(255,255,255,.08),inset 0 4px 10px rgba(0,0,0,.9)}
.stick::before{content:"";position:absolute;inset:13%;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.knob{position:absolute;z-index:1;left:24%;top:24%;width:52%;height:52%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 30%,#5a5d65,#2b2d32 46%,#141518 78%);
  box-shadow:0 7px 12px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.2),inset 0 -4px 6px rgba(0,0,0,.6);
  transform:translate(var(--kx,0px),var(--ky,0px));transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.knob::after{content:"";position:absolute;inset:17%;border-radius:50%;
  background:repeating-radial-gradient(circle,#2c2e33 0 2px,#1b1c20 2px 4px);box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.1)}
.stick.active .knob{transition:none}
.mid{gap:4.5cqh;justify-content:center;width:100%}
.stripe{width:100%;height:10px;height:min(7cqh,3.6cqw);border-radius:3px;background:linear-gradient(var(--stripe-hi),var(--stripe-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.lbls{display:flex;justify-content:space-around;width:100%;font-size:9px;font-size:min(3.6cqh,2.1cqw);color:var(--label);letter-spacing:.04em}
.well{width:100%;display:flex;justify-content:space-evenly;align-items:center;padding:9% 6%;border-radius:7px;
  background:linear-gradient(#d5d6d9,#a1a3a8);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.6)}
button{font:inherit;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.pill{position:relative;width:38%;height:18px;height:max(14px,8cqh);border-radius:999px;
  background:linear-gradient(#2c2d31,#121315);box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.14)}
.pill::after{content:"";position:absolute;inset:-12px -6px}
.pill.on{transform:translateY(2px);box-shadow:0 1px 0 #050506}
.right{gap:3cqh}
.brand{align-self:flex-end;margin-right:4%;font-size:16px;font-size:min(8cqh,4.4cqw);color:var(--label);letter-spacing:.01em;white-space:nowrap}
.ab{display:flex;gap:4cqw;align-items:flex-start}
.btnwrap{display:flex;flex-direction:column;align-items:center;gap:1.6cqh}
.btnwrap span{font-size:11px;font-size:min(5cqh,2.8cqw);color:var(--label)}
.sq{width:56px;width:min(15.5cqw,44cqh);aspect-ratio:1;border-radius:13%;display:grid;place-items:center;
  background:linear-gradient(#dcdde0,#9c9ea3);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(0,0,0,.65)}
.rb{position:relative;width:82%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,var(--red-hi),var(--red) 44%,var(--red-lo));
  box-shadow:0 4px 0 #560a08,inset 0 -3px 6px rgba(0,0,0,.3);transition:transform .04s}
.rb::after{content:"";position:absolute;inset:-14%;border-radius:50%}
.rb.on{transform:translateY(3px);box-shadow:0 1px 0 #560a08,inset 0 3px 6px rgba(0,0,0,.45)}

.ctl{container-type:size;position:relative;width:100%;height:100%;max-height:calc(100vw * .62);max-width:calc(50vh * 2.3);display:grid;grid-template-columns:1fr .5fr 1fr;
  border-radius:clamp(26px,9cqh,60px);background:linear-gradient(180deg,#fdfdfd,#ececee 60%,#dcdce0);box-shadow:inset 0 3px 0 #fff,inset 0 -6px 12px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.45);padding:4cqh 3cqw}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ctl{background:linear-gradient(180deg,#f0f0f2,#dcdce0 60%,#c9c9ce)}}
.cl,.cr{position:relative}
.ctl .stick{position:absolute;width:96px;width:min(25cqw,52cqh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a2b2f,#0e0f11 72%);box-shadow:0 0 0 3px #d3d3d7,0 0 0 5px #bfbfc4,inset 0 4px 10px rgba(0,0,0,.9)}
.cl .stick{left:2%;top:2%}#stick2{left:2%;bottom:0}
.dpad{position:absolute;right:0;bottom:0;width:80px;width:min(20cqw,44cqh);aspect-ratio:1;border-radius:50%;background:#101114;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 0 0 3px #d3d3d7}
.dp{position:absolute;background:linear-gradient(160deg,#3a3c42,#1a1b1f);border:0;padding:0;touch-action:none}
.dp.u,.dp.d{left:35%;width:30%;height:34%}.dp.u{top:4%;border-radius:4px 4px 0 0}.dp.d{bottom:4%;border-radius:0 0 4px 4px}
.dp.l,.dp.r{top:35%;height:30%;width:34%}.dp.l{left:4%;border-radius:4px 0 0 4px}.dp.r{right:4%;border-radius:0 4px 4px 0}
.dc{position:absolute;left:35%;top:35%;width:30%;height:30%;background:#1f2024;pointer-events:none}
.dp.on{filter:brightness(1.7)}
.abxy{position:absolute;right:0;top:-2%;width:100px;width:min(24cqw,50cqh);aspect-ratio:1}
.fb{position:absolute;width:38%;aspect-ratio:1;border-radius:50%;border:0;font-family:system-ui,sans-serif;font-weight:700;font-size:15px;font-size:min(5.4cqw,11cqh);
  background:radial-gradient(circle at 40% 32%,#45464c,#16171a 62%,#0a0a0c);box-shadow:0 3px 0 #000,0 0 0 2px #c9c9cd;touch-action:none}
.fb::after{content:"";position:absolute;inset:-12%;border-radius:50%}
.fb.y{left:31%;top:0;color:#f3d23a}.fb.x{left:0;top:31%;color:#3d7fe6}.fb.a{right:0;top:31%;color:#5fd14c}.fb.b{left:31%;bottom:0;color:#e5483b}
.fb.on{transform:translateY(2px);box-shadow:0 1px 0 #000,0 0 0 2px #c9c9cd}
.cm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh}
.mini{width:34px;width:min(9cqw,20cqh);aspect-ratio:1;border-radius:50%;background:linear-gradient(#fff,#e2e2e6);color:#2a2b30;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 1px 0 #fff;display:grid;place-items:center;border:0;touch-action:none}
.mini svg{width:55%;height:55%}.mini.on{transform:translateY(1px)}
.logo{font-size:11px;font-size:min(3.4cqw,7cqh);letter-spacing:.14em;color:#8a8b92}
#hud.alley #alx{display:none!important}
</style>
</head>

function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTERB=AC.createGain();MASTERB.connect(AC.destination);SFXB=AC.createGain();SFXB.connect(MASTERB);MUSB=AC.createGain();MUSB.connect(MASTERB);applyVolumes();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}

function noise(dur,f0,f1,vol,type,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const n=AC.createBufferSource();n.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  n.connect(f);f.connect(g);g.connect(OUTB||SFXB);n.start(t);n.stop(t+dur+0.02);}
function tone(f0,f1,dur,vol,type,delay){if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(OUTB||SFXB);o.start(t);o.stop(t+dur+0.02);}

  o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(0.75+Math.random()*0.2),t+d);
  const lfo=AC.createOscillator();lfo.frequency.value=5+Math.random()*4;const lg=AC.createGain();lg.gain.value=6;lfo.connect(lg);lg.connect(o.frequency);
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(500+Math.random()*300,t);f.frequency.linearRampToValueAtTime(350,t+d);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.22*vol,t+0.15);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(f);f.connect(g);g.connect(OUTB||SFXB);o.start(t);lfo.start(t);o.stop(t+d+0.05);lfo.stop(t+d+0.05);return d;}

function faceState(){return {blinkT:1+Math.random()*3,blink:0,dir:0,dbl:false,lid:0.45,brow:0,furrow:0,mouth:0,gx:0,gy:0,tgx:0,tgy:0,saccT:Math.random()};}
function animateFace(face,st,dt,o){
  st.blinkT-=dt;if(st.blinkT<=0&&st.dir===0){st.dir=1;st.blinkT=o.blinkMin+Math.random()*o.blinkVar;st.dbl=Math.random()<0.15;}
  if(st.dir===1){st.blink+=dt/0.07;if(st.blink>=1){st.blink=1;st.dir=-1;}}else if(st.dir===-1){st.blink-=dt/0.12;if(st.blink<=0){st.blink=0;st.dir=0;if(st.dbl){st.dbl=false;st.blinkT=0.1;}}}
  st.lid=damp(st.lid,o.lid,10,dt);const la=lerp(st.lid,-0.42,st.blink);for(const l of face.lids)l.rotation.x=la;
  st.saccT-=dt;if(st.saccT<=0){st.saccT=0.35+Math.random()*1.9;st.tgx=o.gazeYaw+(Math.random()-.5)*0.22;st.tgy=o.gazePitch+(Math.random()-.5)*0.14;}
  st.gx=damp(st.gx,clamp(st.tgx,-0.42,0.42),28,dt);st.gy=damp(st.gy,clamp(st.tgy,-0.28,0.28),28,dt);for(const e of face.eyes){e.rotation.y=st.gx;e.rotation.x=st.gy;}
  st.brow=damp(st.brow,o.brow,8,dt);st.furrow=damp(st.furrow,o.furrow,8,dt);
  for(const b of face.brows){const s=b.userData.s;b.position.y=0.265+0.045*st.brow-0.02*st.furrow;b.rotation.z=s*(Math.PI/2+b.userData.base+0.32*st.furrow-0.16*st.brow);}
  st.mouth=damp(st.mouth,o.mouth,20,dt);
  // blendshape expressions: each eases toward its target so faces move, not snap
  const ex=st.ex||(st.ex={smL:0,smR:0,frL:0,frR:0,puck:0,sneer:0,snarl:0,puff:0,sqL:0,sqR:0,jawX:0});const t=o.ex||{};
  const sm=t.smile||0,fr=t.frown||0,sq=t.squint||0,tg={smL:t.smL??sm,smR:t.smR??sm,frL:t.frL??fr,frR:t.frR??fr,puck:t.pucker||0,sneer:t.sneer||0,snarl:t.snarl||0,puff:t.puff||0,sqL:t.sqL??sq,sqR:t.sqR??sq,jawX:t.jawX||0};
  for(const k in ex)ex[k]=damp(ex[k],tg[k],12,dt);

  if(mi&&mi.length>=12){mi[0]=Math.min(1,st.mouth*1.1);mi[1]=ex.smL;mi[2]=ex.smR;mi[3]=ex.frL;mi[4]=ex.frR;mi[5]=ex.puck;mi[6]=ex.sneer;mi[7]=ex.snarl;mi[8]=ex.puff;mi[9]=ex.sqL;mi[10]=ex.sqR;mi[11]=ex.jawX;}
  if(face.jawMeshes)for(const m of face.jawMeshes){if(m.morphTargetInfluences){m.morphTargetInfluences[0]=Math.min(1,st.mouth*1.1);m.morphTargetInfluences[1]=ex.jawX;}}

function bindBtnH(k,down,up){BTN_H[k]=[down,up];if($(k))bindBtn($(k),down,up);}
function bindBtn(el,down,up){
  let id=null;
  el.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('on');down&&down();});
  const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('on');up&&up();};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
  el.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();el.classList.add('on');down&&down();}});
  el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){el.classList.remove('on');up&&up();}});
}
bindBtn($('bStart'),pressStart);
// game actions; menus keep fixed buttons, gameplay uses the player's own mapping
const ACTIONS={trap:'Place trap',traptype:'Switch trap',jump:'Jump',crouch:'Crouch / slide / prone',shoot:'Shoot',reload:'Reload',grenade:'Grenade',use:'Drive / use',aim:'Aim (toggle)',light:'Flashlight',shoulder:'Swap shoulder',prev:'Prev weapon',next:'Next weapon',none:'Nothing'};
const BTN_NAMES={bB:'B',bA:'A',bX:'X',bY:'Y',dU:'D-pad up',dD:'D-pad down',dL:'D-pad left',dR:'D-pad right',bSel:'View button',bL1:'L1 bumper',bR1:'R1 bumper',gL2:'L2 trigger',gR2:'R2 trigger'};
const MAP_DEFAULT={bB:'shoot',bA:'reload',bX:'grenade',bY:'use',dU:'light',dD:'crouch',dL:'aim',dR:'next',bSel:'shoulder',bL1:'trap',bR1:'traptype',gL2:'aim',gR2:'shoot'};
const BMAP=(()=>{try{return Object.assign({},MAP_DEFAULT,JSON.parse(localStorage.getItem('sb-bmap')||'{}'));}catch(e){return Object.assign({},MAP_DEFAULT);}})();
function saveBmap(){try{localStorage.setItem('sb-bmap',JSON.stringify(BMAP));}catch(e){}refreshMapLabels();}
const ACT_SHORT={trap:'Trap',traptype:'Trap type',jump:'Jump',crouch:'Crouch',shoot:'Shoot',reload:'Reload',grenade:'Grenade',use:'Use',aim:'Aim',light:'Light',shoulder:'Shoulder',prev:'Prev',next:'Next',none:'\u2014'};
function refreshMapLabels(){for(const k in BMAP){const el=$(k);if(el)el.setAttribute('data-map',ACT_SHORT[BMAP[k]]||'');}}
function doAction(act,down,hold){if(P.tank&&down&&(act==='traptype'||act==='next'||act==='prev'||act==='grenade'||act==='reload')){switchTankGun();return;}if(P.tank&&act==='shoot'){input.fire=down;return;}if(P.tank&&act!=='use')return;if(act==='shoot'){input.fire=down;return;}if(act==='aim'&&hold){P.adsHold=down;return;}if(!down)return;
  if(act==='trap'){placeTrap();return;}if(act==='traptype'){switchTrap();return;}
  if(act==='reload')pressReload();else if(act==='grenade')throwNade();else if(act==='use'){if(P.tank)exitTank();else if(HORDE&&nearTank())enterTank();else if(P.car)exitCar();else{const c=nearDrivable();if(c)enterCar(c);else heroJump();}}
  else if(act==='jump')heroJump();else if(act==='crouch')heroCrouch();
  else if(act==='aim'){P.adsHold=!P.adsHold;tone(P.adsHold?900:700,P.adsHold?1100:600,0.03,0.08,'square');}else if(act==='light')toggleLight();else if(act==='shoulder')pressSelect();else if(act==='prev')cycleWeapon(-1);else if(act==='next')cycleWeapon(1);}
const MENU_BTN={bL1:()=>menuMove(-1),bR1:()=>menuMove(1),gL2:()=>{},gR2:()=>menuActivate(),bB:()=>menuActivate(),bA:()=>menuActivate(),bX:()=>menuMove(-1),bY:()=>{if(G.state==='title')toggleLoadout();else menuActivate();},dU:()=>menuMove(-1),dD:()=>menuMove(1),dL:()=>{},dR:()=>{},bSel:()=>{}};
const BTN_H={};for(const k in BMAP){BTN_H[k]=[];bindBtnH(k,()=>{initAudio();if(G.state==='loadout'){if(k==='bA')loActivate();else if(k==='bY')toggleLoadout();return;}
    if(MENU_STATES.includes(G.state)){MENU_BTN[k]();return;}if(G.state==='alley'){if(BMAP[k]==='shoot')alleyShoot(AL.cx,AL.cy);return;}if(G.state==='play')doAction(BMAP[k],true,k[0]==='g');},
  ()=>{if(BMAP[k]==='shoot')input.fire=false;if(BMAP[k]==='aim'&&k[0]==='g')P.adsHold=false;});}
refreshMapLabels();
$('alPause').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(G.state==='alley')setState('alleypaused');});
$('fsBtn').addEventListener('click',e=>{e.stopPropagation();toggleFull();});

const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
  if(keyMap[e.code]){input[keyMap[e.code]]=true;e.preventDefault();}
  else if((e.code==='Space'||e.code==='KeyK')&&!e.repeat){initAudio();e.preventDefault();if(MENU_STATES.includes(G.state))menuActivate();else if(G.state==='alley')alleyShoot(AL.cx,AL.cy);else input.fire=true;}
  else if((e.code==='KeyR'||e.code==='KeyJ')&&!e.repeat)pressReload();
  else if(e.code==='Enter'&&!e.repeat)pressStart();
  else if((e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Tab')&&!e.repeat){e.preventDefault();pressSelect();}
});
addEventListener('keyup',e=>{if(keyMap[e.code])input[keyMap[e.code]]=false;else if(e.code==='Space'||e.code==='KeyK')input.fire=false;});

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.state==='play'||G.state==='alley')){setState(G.state==='play'?'paused':'alleypaused');input.fire=false;releaseStick();}});
})();
</script>
